name: CalorieAdvisor
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  CalorieAdvisor:
    type: application
    platform: iOS
    sources:
      - path: CalorieAdvisor
        excludes:
          - "Info.plist"
          - "CalorieAdvisor.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: CalorieAdvisor
        INFOPLIST_FILE: CalorieAdvisor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CalorieAdvisor/CalorieAdvisor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - CalorieAdvisorTests
  CalorieAdvisorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalorieAdvisorTests
    dependencies:
      - target: CalorieAdvisor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)Tests
        GENERATE_INFOPLIST_FILE: YES
